<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γίνε Μέλος της Κοινότητάς μας | Newsletter</title>
    <style>
        /* Μοντέρνο και Καθαρό CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #2d3748;
        }

        p.subtitle {
            color: #718096;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .message {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            min-height: 20px; /* Keeps layout stable even when empty */
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #667eea;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #5a67d8;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="icon">✉️</span>
        <h1>Μείνε Ενημερωμένος</h1>
        <p class="subtitle">Γίνε μέλος στο newsletter μας και λάβε πρώτος τις αποκλειστικές προσφορές, νέα προϊόντα και οδηγούς άρθρων απευθείας στο email σου.</p>

        <!-- The message container that JS will update -->
        <p class="message" id="statusMessage"></p>

        <form id="newsletterForm">
            <div class="form-group">
                <label for="email">Διεύθυνση Email</label>
                <input type="text" id="email" name="email" placeholder="π.χ. ονομα@παράδειγμα.gr">
            </div>
            
            <input type="submit" value="Εγγραφή Τώρα">
        </form>
    </div>

    <script>
        document.getElementById('newsletterForm').addEventListener('submit', function(event) {
            // Prevent the form from refreshing the page
            event.preventDefault();

            // Get the email input value and remove trailing/leading spaces
            const emailInput = document.getElementById('email').value.trim();
            const messageBox = document.getElementById('statusMessage');
            
            // Regex for email validation (matches the PHP version)
            const emailRegex = /^[\w\-\.]+@([\w\-]+\.)+[\w\-]{2,4}$/;

            // Simulated "Database" of already registered emails
            const registeredEmails = ["maria@example.com", "kostas@example.com"];

            // Clear previous messages
            messageBox.innerHTML = "";

            // 1. Check for empty field
            if (emailInput === "") {
                messageBox.innerHTML = "<span style='color:red;'>Παρακαλώ συμπληρώστε το email σας.</span>";
            } 
            // 2. Check for invalid email format
            else if (!emailRegex.test(emailInput)) {
                messageBox.innerHTML = "<span style='color:red;'>Το email που εισάγατε δεν έχει έγκυρη μορφή.</span>";
            } 
            // 3. Check if email is already in the "database"
            else if (registeredEmails.includes(emailInput.toLowerCase())) {
                messageBox.innerHTML = `<span style='color:orange;'>Το email <strong>${emailInput}</strong> είναι ήδη εγγεγραμμένο!</span>`;
            } 
            // 4. Success scenario
            else {
                messageBox.innerHTML = `<span style='color:green;'>Επιτυχία! Το email <strong>${emailInput}</strong> προστέθηκε στη λίστα μας.</span>`;
                // Optional: Clear the input field after success
                // document.getElementById('email').value = "";
            }
        });
    </script>

</body>
</html>
